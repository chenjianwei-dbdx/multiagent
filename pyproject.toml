[project]
name = "omas"
version = "0.1.0"
description = "OMAS: office document assembly and provenance-checked delivery (MVP, CLI-first)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pydantic-ai>=0.4",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "docxtpl>=0.16",
    "python-docx>=1.1",
    "jinja2>=3.1",
    "lxml>=5.2",
    "typer>=0.12",
    "filelock>=3.13",
    # ADR 0002: 本地回环 Web 控制台（omas web）；均为锁内既有包，零新增外部依赖
    "starlette>=1.7,<2",
    "uvicorn>=0.54,<0.55",
    "python-multipart>=0.0.32,<0.1",
]

[project.scripts]
omas = "omas.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",  # starlette TestClient（Web 层离线测试）
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omas"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "RUF",
]
ignore = [
    "SIM108",  # ternary is not always clearer
    "UP012",   # explicit .encode("utf-8") documents the project-wide UTF-8 contract
    "RUF001",  # CJK text (incl. fullwidth punctuation) is core business data here
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# probes/scripts may use prints for human-readable probe reports
"probes/*" = ["T201"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["omas"]
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
exclude = ["probes/"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "probe: compatibility probes (may construct real framework objects, still offline)",
    "benchmark: format gate benchmark with gold labels (slower, corpus-based)",
]
